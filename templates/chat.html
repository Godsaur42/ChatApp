{% extends "layout.html" %}

{% block css %}
<style>
    /* Reset and Layout */
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background-color: #e5e5f7; 
        margin: 0; 
        display: flex; 
        height: 100vh; /* Full viewport height */
    }

    .main-wrapper {
        display: flex;
        width: 100%;
        overflow: hidden; /* Prevent body scroll, use container scroll */
    }

    /* Sidebar: Chat List */
    .sidebar {
        width: 260px;
        background-color: #2c3e50;
        color: white;
        display: flex;
        flex-direction: column;
        padding: 20px 0;
    }

    .sidebar h2 {
        padding: 0 20px;
        font-size: 1.2rem;
        margin-bottom: 20px;
        color: #ecf0f1;
    }

    .chat-item {
        padding: 12px 20px;
        cursor: pointer;
        transition: background 0.3s;
        border-bottom: 1px solid #34495e;
    }

    .chat-item:hover {
        background-color: #3e5871;
    }

    /* Main Chat Area */
    .chat-window {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: #f4f4f9;
    }

    .chat-header {
        background: white;
        padding: 15px 25px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        z-index: 10;
    }

    .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Message Bubbles - All Aligned Left */
    .message-box {
        max-width: 70%;
        background: white;
        padding: 12px 16px;
        border-radius: 0 15px 15px 15px; /* "Tail" on the top left */
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        align-self: flex-start; /* Keep everything on the left */
        border-left: 4px solid #007bff;
    }

    .meta-data {
        font-size: 0.75rem;
        font-weight: bold;
        color: #007bff;
        margin-bottom: 4px;
        display: flex;
        justify-content: space-between;
    }

    .timestamp {
        font-weight: normal;
        color: #999;
        margin-left: 10px;
    }

    .content {
        margin: 0;
        line-height: 1.4;
        color: #333;
    }

    /* Input Area */
    .input-area {
        background: white;
        padding: 20px;
        border-top: 1px solid #ddd;
    }

    .input-area input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #eee;
        border-radius: 25px;
        outline: none;
        transition: border-color 0.3s;
        box-sizing: border-box;
    }

    .input-area input:focus {
        border-color: #007bff;
    }
</style>
{% endblock %}

{% block body %}
<div class="main-wrapper">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <h2>Chats</h2>
        {% for chat in chat_list %}
        <div class="chat-item">
            # {{ chat }}
        </div>
        {% endfor %}
    </div>

    <!-- Right Main Area -->
    <div class="chat-window">
        <div class="chat-header">
            <h3>{{ chatname }}</h3>
        </div>

        <div id="chat-container" class="chat-container">
            {% for message in messages %}
            <div class="message-box">
                <div class="meta-data">
                    <span>{{ message[5] }}</span>
                    <span class="timestamp">{{ message[4] }}</span>
                </div>
                <p class="content">{{ message[3] }}</p>
            </div>
            {% endfor %}
        </div>

        <div class="input-area">
            <input id="userinput" type="text" name="userinput" placeholder="Type a message..." autocomplete="off">
            <button type="button" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>
<script>
    const userId = {{user_id}};
    const chatId= {{chat_id}};
    let lastMessage = {{last_message}};
    async function sendMessage(){
        const data = { 
            "userid": userId,
            "chatid": chatId,
            "content": document.getElementById("userinput").value
     };
     document.getElementById("userinput").value="";
        try {
            const response = await fetch('/sendMessage', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json(); // Parse JSON response from Flask
            console.log(result);
        } catch (error) {
            console.error('Error:', error);
        }
    }

    async function updateMessages(){
        const data={
            lastmessage:lastMessage,
            chatid:chatId
        };
        try {
            const response = await fetch('/updateMessages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json(); // Parse JSON response from Flask
            if (result.updates){
                lastMessage=result.last_message;
                for(message of result.new_messages){
                    const messagediv=document.createElement("div");
                    messagediv.className="message-box";
                    const metadata=document.createElement("div");
                    metadata.className="meta-data";
                    const userspan=document.createElement("span");
                    userspan.innerHTML=message[5];
                    const timestamper=document.createElement("span");
                    timestamper.innerHTML=message[4];
                    timestamper.className="timestamp";
                    const contented=document.createElement("p");
                    contented.innerHTML=message[3];
                    contented.className="content";
                    
                    messagediv.appendChild(metadata);
                    metadata.appendChild(userspan);
                    metadata.appendChild(timestamper);
                    messagediv.appendChild(contented);
                    document.getElementById("chat-container").appendChild(messagediv);


                }
                const chatContainer = document.getElementById("chat-container");
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }
async function pollMessages() {
    await updateMessages(); // Wait for the current update to finish
    setTimeout(pollMessages, 5000); // Only then queue the next one
}

// Start the loop
pollMessages();
</script>
{% endblock %}
