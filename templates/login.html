{% extends "layout.html" %}
{% block body%}
<h1>Login</h1>
    <br>
    <form action="{{ url_for('login') }}" method="POST">
        <label>Username:</label>
        <input type="text" class="textinput" name="username"><br>
        <label>Password:</label>
        <input type="password" class="textinput" name="password"><br>
        <input type="submit" value="Submit">
    </form>
    
    <p>Don't have an account? <a href="{{ url_for('register') }}"> Click to go to register</a></p>
{% endblock %}
