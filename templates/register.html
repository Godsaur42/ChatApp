{% extends "layout.html" %}

{% block body %}
    <h1>Register</h1>
    <br>
    <form action="{{ url_for('register') }}" method="POST">
        <label>Username:</label>
        <input type="text" class="textinput" name="username"><br>
        <label>Password:</label>
        <input type="password" class="textinput" name="password"><br>
        <input type="submit" value="Submit">
    </form>
    <br>
    <p>Already have an account? <a href="{{ url_for('login') }}"> Click to go to login</a></p>
{% endblock %}
